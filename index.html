<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Emoji Arena</title>
  <!-- YouTube Playables SDK - MUST load first -->
  <script src="https://www.youtube.com/playables/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      display: block;
      max-width: 100%; max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.3);
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 10;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .score-box, .mode-box {
      background: rgba(0,0,0,0.55);
      border: 1px solid #00ffcc;
      border-radius: 12px;
      padding: 8px 14px;
      color: #00ffcc;
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 0 8px #00ffcc;
      box-shadow: 0 0 15px rgba(0,255,204,0.25);
    }
    .mode-box { color: #ff00ff; border-color: #ff00ff; text-shadow: 0 0 8px #ff00ff; }
    #start-screen, #pause-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0033 0%, #0a0a12 70%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      pointer-events: auto;
    }
    #pause-screen { display: none; }
    .title {
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 900;
      background: linear-gradient(90deg, #ff00ff, #00ffcc, #ffcc00, #ff00ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonFlow 4s linear infinite;
      text-shadow: 0 0 30px rgba(255,0,255,0.5);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    @keyframes neonFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff00ff, #00ffcc);
      border: none;
      color: #0a0a12;
      font-weight: 800;
      font-size: 18px;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      margin: 8px;
      box-shadow: 0 0 25px rgba(0,255,204,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover, .btn:active {
      transform: scale(1.06);
      box-shadow: 0 0 40px rgba(255,0,255,0.7);
    }
    .btn.secondary {
      background: transparent;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      box-shadow: 0 0 15px rgba(0,255,204,0.3);
    }
    .modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 420px;
      margin-top: 16px;
    }
    .mode-btn {
      background: rgba(0,0,0,0.6);
      border: 1px solid #ff00ff;
      color: #ff00ff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      pointer-events: auto;
      text-shadow: 0 0 6px #ff00ff;
    }
    .mode-btn:hover { background: #ff00ff; color: #0a0a12; }
    .highscore {
      margin-top: 20px;
      color: #ffcc00;
      font-size: 16px;
      text-shadow: 0 0 10px #ffcc00;
    }
    .controls-hint {
      position: absolute;
      bottom: 16px;
      color: #666;
      font-size: 12px;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>
    <div id="ui-overlay">
      <div class="hud">
        <div class="score-box">SCORE <span id="score">0</span></div>
        <div class="mode-box" id="mode-label">RUN</div>
      </div>
    </div>

    <div id="start-screen">
      <div class="title">NEON EMOJI ARENA</div>
      <div class="subtitle">Fight · Run · Swim · Chase · Dance · Jump · Dodge</div>
      <button class="btn" id="btn-play">PLAY</button>
      <div class="modes" id="mode-select">
        <button class="mode-btn" data-mode="run">🏃 Run</button>
        <button class="mode-btn" data-mode="fight">⚔️ Fight</button>
        <button class="mode-btn" data-mode="swim">🏊 Swim</button>
        <button class="mode-btn" data-mode="chase">🐕 Chase</button>
        <button class="mode-btn" data-mode="dance">💃 Dance</button>
        <button class="mode-btn" data-mode="jump">🦘 Jump</button>
        <button class="mode-btn" data-mode="dodge">🌀 Dodge</button>
      </div>
      <div class="highscore">BEST: <span id="best">0</span></div>
      <div class="controls-hint">Arrow keys / WASD / Touch · Collect ⭐ ⚡ · Avoid 🌪️ 💥</div>
    </div>

    <div id="pause-screen">
      <div class="title" style="font-size:36px">PAUSED</div>
      <button class="btn" id="btn-resume">RESUME</button>
      <button class="btn secondary" id="btn-menu">MENU</button>
    </div>
  </div>

<script>
/* ========== NEON EMOJI ARENA ========== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// YouTube Playables helpers
const yt = (typeof ytgame !== 'undefined') ? ytgame : null;
const inPlayables = yt && yt.IN_PLAYABLES_ENV;

function firstFrameReady() {
  if (yt && yt.game && yt.game.firstFrameReady) yt.game.firstFrameReady();
}
function gameReady() {
  if (yt && yt.game && yt.game.gameReady) yt.game.gameReady();
}
function sendScore(s) {
  if (yt && yt.game && yt.game.sendScore) yt.game.sendScore(Math.floor(s));
}
function saveData(key, val) {
  try {
    if (yt && yt.game && yt.game.saveData) {
      yt.game.saveData(JSON.stringify({ [key]: val }));
    } else {
      localStorage.setItem('neonEmoji_' + key, JSON.stringify(val));
    }
  } catch(e){}
}
function loadData(key, def) {
  try {
    if (yt && yt.game && yt.game.loadData) {
      // async in real SDK, simplified for demo
      return def;
    }
    const v = localStorage.getItem('neonEmoji_' + key);
    return v ? JSON.parse(v) : def;
  } catch(e){ return def; }
}

// Pause / mute handling
let paused = false;
let muted = false;
if (yt && yt.system) {
  if (yt.system.onPause) yt.system.onPause(() => { paused = true; document.getElementById('pause-screen').style.display = 'flex'; });
  if (yt.system.onResume) yt.system.onResume(() => { paused = false; document.getElementById('pause-screen').style.display = 'none'; });
  if (yt.system.isAudioEnabled) muted = !yt.system.isAudioEnabled();
  if (yt.system.onAudioEnabledChange) yt.system.onAudioEnabledChange(e => muted = !e);
}

// Game state
const NEON = ['#ff00ff','#00ffcc','#ffcc00','#ff0066','#00aaff','#aa00ff'];
let mode = 'run';
let score = 0;
let best = loadData('best', 0);
document.getElementById('best').textContent = best;
let level = 1;
let particles = [];
let frame = 0;
let running = false;

const player = {
  emoji: '😺', x: 0, y: 0, vx: 0, vy: 0,
  speed: 4, strength: 5, size: 1, invuln: 0
};

const enemies = [
  { emoji: '🐶', x:0,y:0, speed:3, strength:4, size:1 },
  { emoji: '🦁', x:0,y:0, speed:4, strength:7, size:1 },
  { emoji: '🐬', x:0,y:0, speed:3, strength:3, size:1 },
  { emoji: '🦄', x:0,y:0, speed:5, strength:5, size:1 },
  { emoji: '🐘', x:0,y:0, speed:2, strength:9, size:1 },
  { emoji: '🐍', x:0,y:0, speed:4, strength:6, size:1 },
  { emoji: '🦊', x:0,y:0, speed:5, strength:4, size:1 },
];

const powerups = [];
const obstacles = [];

function spawnPower() {
  if (powerups.length > 3) return;
  powerups.push({
    emoji: Math.random() > 0.5 ? '⭐' : '⚡',
    type: Math.random() > 0.5 ? 'speed' : 'strength',
    x: Math.random()*W*0.8 + W*0.1,
    y: Math.random()*H*0.7 + H*0.15,
    life: 400
  });
}
function spawnObstacle() {
  if (obstacles.length > 4) return;
  obstacles.push({
    emoji: Math.random() > 0.5 ? '🌪️' : '💥',
    x: Math.random()*W,
    y: Math.random()*H,
    vx: (Math.random()-0.5)*3,
    vy: (Math.random()-0.5)*3,
    life: 600
  });
}

function resetEntities() {
  player.x = W/2; player.y = H/2;
  player.vx = player.vy = 0;
  player.speed = 4 + level*0.3;
  player.strength = 5 + level*0.4;
  player.size = 1; player.invuln = 60;
  enemies.forEach((e,i) => {
    e.x = Math.random()*W; e.y = Math.random()*H;
    e.speed = 2 + Math.random()*3 + level*0.2;
    e.strength = 3 + Math.random()*5 + level*0.3;
  });
  powerups.length = 0;
  obstacles.length = 0;
  for(let i=0;i<2;i++) spawnPower();
  for(let i=0;i<2;i++) spawnObstacle();
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape' && running) togglePause();
});
window.addEventListener('keyup', e => keys[e.code] = false);

let touchX = null, touchY = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  touchX = (t.clientX - r.left);
  touchY = (t.clientY - r.top);
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  touchX = (t.clientX - r.left);
  touchY = (t.clientY - r.top);
}, {passive:false});
canvas.addEventListener('touchend', () => { touchX = touchY = null; });

// Buttons
document.getElementById('btn-play').onclick = () => startGame(mode);
document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.getElementById('mode-label').textContent = mode.toUpperCase();
    startGame(mode);
  };
});
document.getElementById('btn-resume').onclick = () => { paused = false; document.getElementById('pause-screen').style.display = 'none'; };
document.getElementById('btn-menu').onclick = () => {
  running = false;
  paused = false;
  document.getElementById('pause-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
};

function togglePause() {
  paused = !paused;
  document.getElementById('pause-screen').style.display = paused ? 'flex' : 'none';
}

function startGame(m) {
  mode = m || mode;
  score = 0; level = 1;
  document.getElementById('score').textContent = 0;
  document.getElementById('mode-label').textContent = mode.toUpperCase();
  document.getElementById('start-screen').style.display = 'none';
  running = true;
  resetEntities();
  gameReady();
}

// Particles
function addParticle(x, y, color) {
  for (let i=0; i<6; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 30 + Math.random()*20,
      color: color || NEON[Math.floor(Math.random()*NEON.length)],
      size: 2 + Math.random()*3
    });
  }
}

// Main loop
function update() {
  if (!running || paused) return;
  frame++;

  // Player movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

  if (touchX !== null) {
    dx = (touchX - player.x) * 0.08;
    dy = (touchY - player.y) * 0.08;
  }

  const len = Math.hypot(dx, dy) || 1;
  player.vx = (dx / len) * player.speed;
  player.vy = (dy / len) * player.speed;

  if (mode === 'run' || mode === 'jump') {
    player.x += player.speed * 0.7;
    if (player.x > W + 40) {
      player.x = -40;
      score += 15;
      addParticle(player.x, player.y, '#00ffcc');
      if (score % 50 === 0) level++;
    }
  } else {
    player.x += player.vx;
    player.y += player.vy;
  }
  if (mode === 'swim') {
    player.y -= 1.2;
    if (player.y < -30) { player.y = H + 30; score += 12; }
  }
  if (mode === 'jump') {
    player.y += Math.sin(frame * 0.12) * 4;
  }

  player.x = Math.max(20, Math.min(W-20, player.x));
  player.y = Math.max(20, Math.min(H-20, player.y));
  if (player.invuln > 0) player.invuln--;

  // Enemies AI
  enemies.forEach((e, i) => {
    if (mode === 'chase' || mode === 'dodge') {
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      e.x += Math.cos(ang) * e.speed * 0.6;
      e.y += Math.sin(ang) * e.speed * 0.6;
    } else if (mode === 'run' || mode === 'jump') {
      e.x += e.speed;
      if (e.x > W + 50) e.x = -50;
    } else if (mode === 'swim') {
      e.y -= e.speed * 0.5;
      if (e.y < -40) e.y = H + 40;
    } else if (mode === 'dance') {
      e.x += Math.sin(frame*0.05 + i) * e.speed;
      e.y += Math.cos(frame*0.07 + i) * e.speed;
    } else { // fight
      e.x += (Math.random()-0.5) * e.speed;
      e.y += (Math.random()-0.5) * e.speed;
    }
    e.x = ((e.x % (W+80)) + W+80) % (W+80) - 40;
    e.y = ((e.y % (H+80)) + H+80) % (H+80) - 40;

    // Collision with player
    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    if (dist < 36 && player.invuln <= 0) {
      if (mode === 'fight' && player.strength >= e.strength) {
        score += 20;
        addParticle(e.x, e.y, '#ff00ff');
        e.x = Math.random()*W; e.y = Math.random()*H;
        player.invuln = 20;
      } else if (mode === 'chase' || mode === 'dodge') {
        score += 25;
        addParticle(e.x, e.y, '#00ffcc');
        e.x = Math.random()*W; e.y = Math.random()*H;
      } else {
        score = Math.max(0, score - 8);
        player.invuln = 40;
        addParticle(player.x, player.y, '#ff0066');
      }
    }
  });

  // Powerups
  powerups.forEach((p, i) => {
    p.life--;
    if (Math.hypot(player.x - p.x, player.y - p.y) < 30) {
      if (p.type === 'speed') player.speed += 1.5;
      else player.strength += 2;
      score += 15;
      addParticle(p.x, p.y, '#ffcc00');
      powerups.splice(i, 1);
    } else if (p.life <= 0) powerups.splice(i, 1);
  });
  if (frame % 180 === 0) spawnPower();

  // Obstacles
  obstacles.forEach((o, i) => {
    o.x += o.vx; o.y += o.vy;
    o.life--;
    if (o.x < 0 || o.x > W) o.vx *= -1;
    if (o.y < 0 || o.y > H) o.vy *= -1;
    if (Math.hypot(player.x - o.x, player.y - o.y) < 32 && player.invuln <= 0) {
      score = Math.max(0, score - 12);
      player.invuln = 45;
      addParticle(player.x, player.y, '#ff0066');
    }
    if (o.life <= 0) obstacles.splice(i, 1);
  });
  if (frame % 220 === 0) spawnObstacle();

  // Particles update
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy;
    p.life--; p.size *= 0.96;
    if (p.life <= 0) particles.splice(i, 1);
  });

  // Score update
  document.getElementById('score').textContent = Math.floor(score);
  if (score > best) {
    best = Math.floor(score);
    document.getElementById('best').textContent = best;
    saveData('best', best);
    sendScore(best);
  }
}

function draw() {
  // Neon background
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(0,255,204,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // Glow helper
  function glowText(text, x, y, size, color) {
    ctx.save();
    ctx.font = `bold ${size}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 0;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // Particles
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.min(1, p.life/20);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Obstacles
  obstacles.forEach(o => glowText(o.emoji, o.x, o.y, 28, '#ff0066'));

  // Powerups
  powerups.forEach(p => {
    const pulse = 1 + Math.sin(frame*0.15)*0.15;
    glowText(p.emoji, p.x, p.y, 32*pulse, '#ffcc00');
  });

  // Enemies
  enemies.forEach((e,i) => {
    const col = NEON[i % NEON.length];
    const s = 28 + Math.sin(frame*0.1 + i)*3;
    glowText(e.emoji, e.x, e.y, s, col);
  });

  // Player
  const pCol = player.invuln > 0 && frame % 6 < 3 ? '#ffffff' : '#00ffcc';
  const pSize = 34 + Math.sin(frame*0.12)*4;
  glowText(player.emoji, player.x, player.y, pSize, pCol);

  // Mode specific fx
  if (mode === 'swim') {
    ctx.fillStyle = 'rgba(0,100,200,0.08)';
    ctx.fillRect(0,0,W,H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Boot
firstFrameReady();
document.getElementById('start-screen').style.display = 'flex';
loop();
// Signal ready after short delay so menu is interactive
setTimeout(gameReady, 300);
</script>
</body>
</html>
