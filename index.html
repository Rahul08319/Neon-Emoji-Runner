<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Emoji Memory</title>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    #app {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    h1 {
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      text-align: center;
      color: #0ff;
      text-shadow: 0 0 8px #0ff, 0 0 16px #0ff, 0 0 24px #f0f;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    #hud {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      color: #0ff;
      text-shadow: 0 0 6px #0ff;
    }
    #hud span { white-space: nowrap; }
    #board {
      display: grid;
      gap: clamp(4px, 1.5vw, 10px);
      background: rgba(0,0,0,0.55);
      padding: clamp(8px, 2vw, 16px);
      border-radius: 16px;
      box-shadow: 0 0 20px #0ff, 0 0 40px #f0f44a22;
      max-width: 96vw;
      max-height: 70vh;
    }
    .card {
      width: clamp(48px, 14vw, 90px);
      height: clamp(48px, 14vw, 90px);
      background: #16162a;
      border: 2px solid #0ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      box-shadow: 0 0 8px #0ff66, inset 0 0 8px #0ff22;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(0.95); }
    .card.flipped, .card.matched {
      background: #0ff;
      color: #000;
      transform: rotateY(180deg);
      box-shadow: 0 0 18px #0ff, inset 0 0 12px #fff;
    }
    .card.matched {
      border-color: #f0f;
      animation: matchPulse 0.8s infinite alternate;
    }
    @keyframes matchPulse {
      from { box-shadow: 0 0 12px #f0f, inset 0 0 8px #f0f; }
      to   { box-shadow: 0 0 24px #f0f, inset 0 0 16px #f0f; }
    }
    #start-screen, #win-screen {
      position: absolute;
      inset: 0;
      background: rgba(5,5,15,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 16px;
      padding: 16px;
      text-align: center;
    }
    #win-screen { display: none; }
    .btn {
      padding: 12px 28px;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      border-radius: 12px;
      cursor: pointer;
      text-shadow: 0 0 8px #0ff;
      box-shadow: 0 0 14px #0ff;
      transition: all 0.2s;
      min-width: 140px;
    }
    .btn:hover, .btn:active {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 28px #0ff, 0 0 40px #f0f;
    }
    .btn.magenta {
      border-color: #f0f;
      color: #f0f;
      box-shadow: 0 0 14px #f0f;
    }
    .btn.magenta:hover, .btn.magenta:active {
      background: #f0f;
      color: #000;
    }
    .diff-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #combo {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #ff0;
      text-shadow: 0 0 12px #ff0, 0 0 24px #f80;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.3s;
    }
    #combo.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  <div id="app">
    <h1>NEON EMOJI MEMORY</h1>
    <div id="hud">
      <span id="moves">Moves: 0</span>
      <span id="timer">Time: 0s</span>
      <span id="matches">Pairs: 0</span>
      <span id="best">Best: —</span>
    </div>
    <div id="board"></div>
    <div id="combo">COMBO x2!</div>
  </div>

  <div id="start-screen">
    <h1>NEON EMOJI MEMORY</h1>
    <p style="color:#0ff; text-shadow:0 0 8px #0ff; max-width:320px; font-size:0.95rem;">
      Match the glowing neon emojis.<br>Tap or click two cards.
    </p>
    <div class="diff-row">
      <button class="btn" data-diff="easy">Easy 4×4</button>
      <button class="btn magenta" data-diff="normal">Normal 6×4</button>
      <button class="btn" data-diff="hard">Hard 8×4</button>
    </div>
  </div>

  <div id="win-screen">
    <h1 style="color:#f0f; text-shadow:0 0 12px #f0f;">YOU WIN!</h1>
    <p id="win-stats" style="font-size:1.1rem; color:#0ff;"></p>
    <button class="btn magenta" id="play-again">Play Again</button>
  </div>

  <script>
    // ========== YouTube Playables SDK helpers ==========
    const yt = window.ytgame || null;
    function firstFrame() {
      try { yt && yt.game && yt.game.firstFrameReady(); } catch(e){}
    }
    function gameReady() {
      try { yt && yt.game && yt.game.gameReady(); } catch(e){}
    }
    function saveHigh(data) {
      try {
        if (yt && yt.game && yt.game.saveData) {
          yt.game.saveData(JSON.stringify(data));
        } else {
          localStorage.setItem('neonEmojiBest', JSON.stringify(data));
        }
      } catch(e){}
    }
    async function loadHigh() {
      try {
        if (yt && yt.game && yt.game.loadData) {
          const raw = await yt.game.loadData();
          return raw ? JSON.parse(raw) : {};
        }
        return JSON.parse(localStorage.getItem('neonEmojiBest') || '{}');
      } catch(e){ return {}; }
    }

    // Pause / Resume
    let paused = false;
    if (yt && yt.system) {
      yt.system.onPause(() => { paused = true; stopTimer(); });
      yt.system.onResume(() => { paused = false; if (gameStarted) startTimer(); });
    }

    // ========== Audio (Web Audio – no files) ==========
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep(freq=440, dur=0.08, type='square', vol=0.08) {
      try {
        ensureAudio();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = vol;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }
    function playFlip()  { beep(520, 0.06, 'triangle', 0.06); }
    function playMatch() { beep(780, 0.12, 'sine', 0.1); setTimeout(()=>beep(980,0.15,'sine',0.08),90); }
    function playWin()   { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sine',0.1),i*120)); }
    function playMiss()  { beep(220, 0.15, 'sawtooth', 0.05); }

    // ========== Neon emoji set ==========
    const ALL_EMOJIS = ['🪩','🌌','⚡️','🔥','🌃','🌠','💡','🎆','💿','🪐','🌩️','🧬','💎','🚀','🌈','✨','🔮','🪐','🌟','💫','🛸','🔋','📡','🧿'];
    const emojiColors = {
      '🪩':'#ff00ff','🌌':'#00b7eb','⚡️':'#ffff00','🔥':'#ff4500','🌃':'#9b59b6',
      '🌠':'#00ff00','💡':'#ffd700','🎆':'#ff69b4','💿':'#c0c0c0','🪐':'#4682b4',
      '🌩️':'#b0c4de','🧬':'#00fa9a','💎':'#00ffff','🚀':'#ff6b6b','🌈':'#ff9ff3',
      '✨':'#feca57','🔮':'#a29bfe','🌟':'#ffeaa7','💫':'#74b9ff','🛸':'#55efc4',
      '🔋':'#00b894','📡':'#0984e3','🧿':'#6c5ce7'
    };

    // ========== Canvas particles ==========
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(emoji) {
        this.emoji = emoji;
        this.color = emojiColors[emoji] || '#0ff';
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = 18 + Math.random() * 22;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.alpha = 0.25 + Math.random() * 0.35;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < -30) this.x = canvas.width + 30;
        if (this.x > canvas.width + 30) this.x = -30;
        if (this.y < -30) this.y = canvas.height + 30;
        if (this.y > canvas.height + 30) this.y = -30;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.font = `${this.size}px serif`;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.fillText(this.emoji, this.x, this.y);
        ctx.restore();
      }
    }
    function spawnParticles(list, count=40) {
      particles = [];
      const src = list.length ? list : ALL_EMOJIS.slice(0,12);
      for (let i=0; i<count; i++) {
        particles.push(new Particle(src[i % src.length]));
      }
    }
    function animLoop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animLoop);
    }
    spawnParticles([]);
    animLoop();

    // ========== Game state ==========
    let cards = [], flipped = [], matched = 0, moves = 0, lock = false;
    let totalPairs = 0, gameStarted = false, timer = 0, timerId = null, combo = 0;
    let bestScores = {};

    const boardEl = document.getElementById('board');
    const startScreen = document.getElementById('start-screen');
    const winScreen = document.getElementById('win-screen');
    const comboEl = document.getElementById('combo');

    function shuffle(a) {
      for (let i=a.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function updateHUD() {
      document.getElementById('moves').textContent = `Moves: ${moves}`;
      document.getElementById('timer').textContent = `Time: ${timer}s`;
      document.getElementById('matches').textContent = `Pairs: ${matched}/${totalPairs}`;
      const key = currentDiff;
      const b = bestScores[key];
      document.getElementById('best').textContent = b ? `Best: ${b.moves}m / ${b.time}s` : 'Best: —';
    }

    function startTimer() {
      stopTimer();
      timerId = setInterval(() => {
        if (!paused) { timer++; updateHUD(); }
      }, 1000);
    }
    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    function showCombo() {
      if (combo < 2) return;
      comboEl.textContent = `COMBO x${combo}!`;
      comboEl.classList.add('show');
      setTimeout(() => comboEl.classList.remove('show'), 800);
    }

    function createBoard(diff) {
      currentDiff = diff;
      let cols, pairs;
      if (diff === 'easy')   { cols = 4; pairs = 8; }
      else if (diff === 'hard') { cols = 8; pairs = 16; }
      else                    { cols = 6; pairs = 12; }

      totalPairs = pairs;
      const chosen = shuffle([...ALL_EMOJIS]).slice(0, pairs);
      cards = shuffle([...chosen, ...chosen]);
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      cards.forEach((emoji, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.idx = idx;
        card.addEventListener('click', () => flip(card));
        boardEl.appendChild(card);
      });

      flipped = [];
      matched = 0;
      moves = 0;
      timer = 0;
      combo = 0;
      lock = false;
      gameStarted = true;
      updateHUD();
      startTimer();
      spawnParticles(chosen, 50);
    }

    function flip(card) {
      if (paused || lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      ensureAudio();
      playFlip();
      card.classList.add('flipped');
      card.textContent = card.dataset.emoji;
      flipped.push(card);

      if (flipped.length === 2) {
        lock = true;
        moves++;
        updateHUD();
        checkMatch();
      }
    }

    function checkMatch() {
      const [a, b] = flipped;
      if (a.dataset.emoji === b.dataset.emoji) {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        combo++;
        playMatch();
        showCombo();
        flipped = [];
        lock = false;
        updateHUD();
        spawnParticles([a.dataset.emoji], 30);
        if (matched === totalPairs) {
          stopTimer();
          playWin();
          setTimeout(showWin, 600);
        }
      } else {
        combo = 0;
        playMiss();
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          a.textContent = '';
          b.textContent = '';
          flipped = [];
          lock = false;
        }, 700);
      }
    }

    function showWin() {
      const key = currentDiff;
      const prev = bestScores[key];
      let isNew = false;
      if (!prev || moves < prev.moves || (moves === prev.moves && timer < prev.time)) {
        bestScores[key] = { moves, time: timer };
        saveHigh(bestScores);
        isNew = true;
      }
      document.getElementById('win-stats').innerHTML =
        `Moves: <b>${moves}</b> &nbsp;|&nbsp; Time: <b>${timer}s</b><br>` +
        (isNew ? '<span style="color:#ff0">NEW BEST SCORE!</span>' : '');
      winScreen.style.display = 'flex';
    }

    // ========== UI events ==========
    let currentDiff = 'normal';
    document.querySelectorAll('[data-diff]').forEach(btn => {
      btn.addEventListener('click', () => {
        ensureAudio();
        startScreen.classList.add('hidden');
        createBoard(btn.dataset.diff);
        gameReady(); // now interactive
      });
    });

    document.getElementById('play-again').addEventListener('click', () => {
      winScreen.style.display = 'none';
      startScreen.classList.remove('hidden');
      gameStarted = false;
      stopTimer();
    });

    // Keyboard
    window.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (!startScreen.classList.contains('hidden')) {
          document.querySelector('[data-diff="normal"]').click();
        } else if (winScreen.style.display === 'flex') {
          document.getElementById('play-again').click();
        }
      }
    });

    // ========== Boot ==========
    (async () => {
      bestScores = await loadHigh();
      firstFrame(); // splash is visible
      // gameReady is called when user picks difficulty
    })();
  </script>
</body>
</html>
