<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Emoji Runner</title>
    <!-- YouTube Playables SDK MUST load before any game code -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
        html,body{width:100%;height:100%;overflow:hidden;background:#05050c;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;touch-action:none}
        #gameContainer{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#05050c}
        #gameArea{position:relative;width:100%;height:100%;max-width:100vw;max-height:100vh;background:linear-gradient(180deg,#060612 0%,#0b0b1e 45%,#08081a 100%);overflow:hidden}
        #gameArea::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,.06) 1px,transparent 1px);background-size:36px 36px;animation:gridMove 7s linear infinite;pointer-events:none;z-index:0}
        @keyframes gridMove{0%{background-position:0 0}100%{background-position:0 36px}}
        #horizon{position:absolute;bottom:26%;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#0ff,#f0f,#0ff,transparent);box-shadow:0 0 18px #0ff,0 0 36px #0ff;opacity:.55;z-index:1}
        .emoji{position:absolute;font-size:clamp(1.7rem,4.8vw,2.7rem);z-index:10;will-change:transform,left,top;filter:drop-shadow(0 0 5px currentColor)}
        .player{z-index:25;font-size:clamp(2.1rem,5.8vw,3.1rem)!important}
        .invincible{animation:invPulse .35s ease-in-out infinite;filter:drop-shadow(0 0 14px #0ff) drop-shadow(0 0 22px #fff)!important}
        @keyframes invPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.88}}
        .particle{position:absolute;pointer-events:none;z-index:5;border-radius:50%}
        #uiLayer{position:absolute;inset:0;pointer-events:none;z-index:50}
        #scoreDisplay,#highScoreDisplay,#comboDisplay{position:absolute;color:#0ff;font-weight:700;text-shadow:0 0 8px #0ff,0 0 16px #0ff;font-size:clamp(1rem,2.9vw,1.35rem);letter-spacing:1px}
        #scoreDisplay{top:12px;left:14px}#highScoreDisplay{top:12px;right:14px}
        #comboDisplay{top:46px;left:50%;transform:translateX(-50%);color:#ff0;text-shadow:0 0 10px #ff0;opacity:0;transition:opacity .25s}
        #powerUpTimer{position:absolute;top:46px;left:14px;color:#0f0;font-size:clamp(.8rem,2.4vw,1.05rem);text-shadow:0 0 8px #0f0;opacity:0}
        #touchControls{position:absolute;bottom:18px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:40;opacity:.75}
        .touchBtn{width:68px;height:68px;border-radius:50%;background:rgba(0,255,255,.14);border:2px solid rgba(0,255,255,.45);color:#0ff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 0 14px rgba(0,255,255,.28);transition:transform .1s,background .1s}
        .touchBtn:active,.touchBtn.active{transform:scale(.92);background:rgba(0,255,255,.32)}
        #jumpBtn{margin:0 auto;width:78px;height:78px;background:rgba(255,0,255,.14);border-color:rgba(255,0,255,.45);color:#f0f;box-shadow:0 0 14px rgba(255,0,255,.28)}
        .overlay{position:absolute;inset:0;background:rgba(4,4,12,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center;padding:20px}
        .overlay h1{font-size:clamp(1.7rem,5.8vw,2.9rem);color:#0ff;text-shadow:0 0 14px #0ff,0 0 28px #0ff;margin-bottom:10px;letter-spacing:2px}
        .overlay p{font-size:clamp(.92rem,2.7vw,1.12rem);color:#aaa;max-width:400px;margin-bottom:6px;line-height:1.45}
        .overlay .score-big{font-size:clamp(1.5rem,4.8vw,2.3rem);color:#ff0;text-shadow:0 0 12px #ff0;margin:14px 0}
        .btn{margin-top:16px;padding:13px 34px;font-size:clamp(1rem,2.9vw,1.2rem);font-weight:700;background:linear-gradient(135deg,#0ff,#08f);color:#000;border:none;border-radius:40px;cursor:pointer;box-shadow:0 0 18px rgba(0,255,255,.45);transition:transform .15s,box-shadow .15s;pointer-events:auto;letter-spacing:1px}
        .btn:hover,.btn:active{transform:scale(1.05);box-shadow:0 0 28px rgba(0,255,255,.75)}
        #pauseOverlay,#gameOverOverlay{display:none}#startOverlay{display:flex}
        .hint{margin-top:20px;font-size:.82rem;color:#555}
        @media(max-width:500px){.touchBtn{width:56px;height:56px;font-size:1.35rem}#jumpBtn{width:66px;height:66px}#touchControls{bottom:10px;padding:0 10px}}
        @media(min-width:900px){#touchControls{display:none}}
        .shake{animation:shake .4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="gameArea">
        <div id="horizon"></div>
        <div id="uiLayer">
            <div id="scoreDisplay">SCORE 0</div>
            <div id="highScoreDisplay">BEST 0</div>
            <div id="comboDisplay">COMBO x2</div>
            <div id="powerUpTimer"></div>
        </div>
        <div id="touchControls">
            <div class="touchBtn" id="leftBtn">◀</div>
            <div class="touchBtn" id="jumpBtn">▲</div>
            <div class="touchBtn" id="rightBtn">▶</div>
        </div>
        <div class="overlay" id="startOverlay">
            <h1>NEON EMOJI RUNNER</h1>
            <p>Dodge obstacles • Collect power-ups • Chain combos</p>
            <p style="color:#0ff;margin-top:10px">← → / A D to move • ▲ / Space / Jump to jump</p>
            <button class="btn" id="startBtn">PLAY</button>
            <p class="hint">Rahul Kumar • YouTube Playables Ready</p>
        </div>
        <div class="overlay" id="pauseOverlay">
            <h1>PAUSED</h1>
            <p>Neon city is waiting</p>
            <button class="btn" id="resumeBtn">RESUME</button>
        </div>
        <div class="overlay" id="gameOverOverlay">
            <h1>GAME OVER</h1>
            <div class="score-big" id="finalScore">0</div>
            <p id="newBestText" style="color:#0f0;display:none">NEW HIGH SCORE!</p>
            <button class="btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>
</div>
<script>
/* ========== YouTube Playables SDK ========== */
const yt = (typeof ytgame !== 'undefined') ? ytgame : null;
let audioEnabled = true;
let platformPaused = false;

if (yt && yt.system) {
    try {
        audioEnabled = yt.system.isAudioEnabled();
        yt.system.onAudioEnabledChange(e => { audioEnabled = e; });
        yt.system.onPause(() => { platformPaused = true; pauseGame(true); });
        yt.system.onResume(() => { platformPaused = false; if (gameState === 'playing') resumeGame(true); });
    } catch (e) {}
}

/* ========== Audio ========== */
let audioCtx = null;
function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playTone(freq, type='sine', dur=0.14, vol=0.28) {
    if (!audioEnabled) return;
    try {
        const ctx = getCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) {}
}

/* ========== State ========== */
const gameArea = document.getElementById('gameArea');
const scoreDisplay = document.getElementById('scoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const comboDisplay = document.getElementById('comboDisplay');
const powerUpTimer = document.getElementById('powerUpTimer');
const startOverlay = document.getElementById('startOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const newBestText = document.getElementById('newBestText');

let gameState = 'start';
let score = 0, highScore = 0, combo = 0, lastPassed = 0;
let entities = [], particles = [], trail = [];
let player = null, lastTime = 0, spawnT = 0, powerT = 0, difficulty = 1;
let invUntil = 0, magUntil = 0, scoreInt = null, rafId = null;
let keys = {left:false,right:false,jump:false};
let groundY = 0, areaW = 0, areaH = 0;
let shakeUntil = 0;

function loadHS() {
    try {
        if (yt && yt.game && yt.game.loadData) {
            yt.game.loadData().then(d => {
                if (d) { const p = JSON.parse(d); if (p.highScore) highScore = p.highScore; }
                highScoreDisplay.textContent = 'BEST ' + highScore;
            }).catch(() => { highScore = +localStorage.getItem('neonRunnerHS') || 0; highScoreDisplay.textContent = 'BEST ' + highScore; });
        } else {
            highScore = +localStorage.getItem('neonRunnerHS') || 0;
            highScoreDisplay.textContent = 'BEST ' + highScore;
        }
    } catch (e) {
        highScore = +localStorage.getItem('neonRunnerHS') || 0;
        highScoreDisplay.textContent = 'BEST ' + highScore;
    }
}
function saveHS() {
    try {
        localStorage.setItem('neonRunnerHS', highScore);
        if (yt && yt.game && yt.game.saveData) yt.game.saveData(JSON.stringify({highScore})).catch(()=>{});
    } catch (e) {}
}

function createPlayer() {
    return {id:'player',char:'🏃',x:70,y:0,vy:0,w:48,h:48,speed:340,grounded:true};
}
const obsTypes = [
    {char:'🧱',color:'#ff3355',pts:10},{char:'🚧',color:'#ffaa00',pts:12},
    {char:'🚨',color:'#ff00aa',pts:15},{char:'💣',color:'#ff5500',pts:20},
    {char:'⚡',color:'#00ffaa',pts:18},{char:'🪨',color:'#cc88ff',pts:14}
];
const pwrTypes = [
    {char:'⭐',type:'inv',color:'#ffd700',dur:5000},
    {char:'💫',type:'mag',color:'#00ffff',dur:5500},
    {char:'🛡️',type:'inv',color:'#00ff88',dur:4000},
    {char:'🚀',type:'speed',color:'#ff66ff',dur:3500}
];

function spawnObs() {
    const t = obsTypes[Math.floor(Math.random()*obsTypes.length)];
    const fly = Math.random() > 0.62;
    entities.push({
        id:'o'+Date.now()+Math.random(),char:t.char,color:t.color,
        x:areaW+50,y:fly?groundY-100-Math.random()*50:groundY,
        w:40,h:40,speed:210+difficulty*38+Math.random()*45,
        isObs:true,pts:t.pts,passed:false
    });
}
function spawnPwr() {
    const t = pwrTypes[Math.floor(Math.random()*pwrTypes.length)];
    entities.push({
        id:'p'+Date.now()+Math.random(),char:t.char,color:t.color,
        x:areaW+40,y:groundY-65-Math.random()*55,w:36,h:36,
        speed:175+difficulty*22,isPwr:true,ptype:t.type,dur:t.dur
    });
}

function render() {
    gameArea.querySelectorAll('.emoji,.particle').forEach(el=>el.remove());
    trail.forEach(t=>{
        const el=document.createElement('div');
        el.className='particle';
        el.style.cssText=`left:${t.x}px;top:${t.y}px;width:${t.s}px;height:${t.s}px;background:${t.c};opacity:${t.life};box-shadow:0 0 ${t.s*2}px ${t.c}`;
        gameArea.appendChild(el);
    });
    if (player) {
        const el=document.createElement('span');
        el.className='emoji player'+(Date.now()<invUntil?' invincible':'');
        el.textContent=player.char;
        el.style.left=player.x+'px';el.style.top=player.y+'px';
        el.style.color=Date.now()<invUntil?'#0ff':'#0f0';
        gameArea.appendChild(el);
    }
    entities.forEach(e=>{
        const el=document.createElement('span');
        el.className='emoji';el.textContent=e.char;
        el.style.left=e.x+'px';el.style.top=e.y+'px';el.style.color=e.color;
        gameArea.appendChild(el);
    });
    particles.forEach(p=>{
        const el=document.createElement('div');
        el.className='particle';
        el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.s}px;height:${p.s}px;background:${p.c};box-shadow:0 0 ${p.s*2}px ${p.c};opacity:${Math.max(0,p.life)}`;
        gameArea.appendChild(el);
    });
    if (Date.now()<shakeUntil) gameArea.classList.add('shake');
    else gameArea.classList.remove('shake');
}

function spawnParts(x,y,c,n=8) {
    for(let i=0;i<n;i++) particles.push({
        x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*24,
        vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200-50,
        s:3+Math.random()*7,c,life:.5+Math.random()*.35
    });
}

function update(dt) {
    if (gameState!=='playing'||platformPaused) return;
    const now=Date.now();

    if (keys.left) player.x-=player.speed*dt;
    if (keys.right) player.x+=player.speed*dt;
    player.x=Math.max(8,Math.min(areaW-player.w-8,player.x));

    if (keys.jump && player.grounded) {
        player.vy=-530; player.grounded=false;
        playTone(540,'sine',.11,.24);
        spawnParts(player.x+20,player.y+38,'#0f0',7);
    }
    keys.jump=false;

    player.vy+=1650*dt;
    player.y+=player.vy*dt;
    if (player.y>=groundY){player.y=groundY;player.vy=0;player.grounded=true;}

    if (Math.random()>.4) {
        trail.push({x:player.x+18,y:player.y+30,s:4+Math.random()*5,c:Date.now()<invUntil?'#0ff':'#0f8',life:.45});
    }
    for(let i=trail.length-1;i>=0;i--){trail[i].life-=dt*1.8;trail[i].y+=20*dt;if(trail[i].life<=0)trail.splice(i,1);}

    for(let i=entities.length-1;i>=0;i--){
        const e=entities[i];
        e.x-=e.speed*dt;
        if(e.isPwr&&now<magUntil){
            const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
            if(d<230){e.x+=dx*4.2*dt;e.y+=dy*4.2*dt;}
        }
        if(e.isObs&&!e.passed&&e.x+e.w<player.x){
            e.passed=true;combo++;score+=e.pts+combo*2;lastPassed=now;updateUI();
            if(combo>=2){comboDisplay.textContent='COMBO x'+combo;comboDisplay.style.opacity='1';}
            playTone(680+combo*35,'triangle',.07,.14);
        }
        if(e.x<-60){
            entities.splice(i,1);
            if(e.isObs&&!e.passed){combo=0;comboDisplay.style.opacity='0';}
        }
    }

    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
        if(p.life<=0)particles.splice(i,1);
    }

    const px=player.x+8,py=player.y+8,pw=player.w-16,ph=player.h-16;
    for(let i=entities.length-1;i>=0;i--){
        const e=entities[i],ex=e.x+5,ey=e.y+5,ew=e.w-10,eh=e.h-10;
        if(px<ex+ew&&px+pw>ex&&py<ey+eh&&py+ph>ey){
            if(e.isPwr){
                spawnParts(e.x,e.y,e.color,14);playTone(920,'triangle',.22,.32);
                if(e.ptype==='inv')invUntil=now+e.dur;
                else if(e.ptype==='mag')magUntil=now+e.dur;
                else if(e.ptype==='speed')player.speed=480;
                setTimeout(()=>{if(e.ptype==='speed')player.speed=340;},e.dur);
                score+=55;updateUI();entities.splice(i,1);
            }else if(e.isObs){
                if(now<invUntil){
                    spawnParts(e.x,e.y,e.color,11);playTone(380,'square',.09,.18);
                    score+=e.pts*2;updateUI();entities.splice(i,1);
                }else{
                    spawnParts(player.x,player.y,'#ff0055',18);
                    playTone(110,'sawtooth',.38,.42);
                    shakeUntil=now+400;
                    gameOver();return;
                }
            }
        }
    }

    spawnT-=dt;
    if(spawnT<=0){spawnObs();spawnT=Math.max(.65,1.55-difficulty*.13)+Math.random()*.35;}
    powerT-=dt;
    if(powerT<=0){if(Math.random()>.3)spawnPwr();powerT=6.5+Math.random()*5;}
    difficulty=1+score/750;

    if(now<invUntil){powerUpTimer.textContent='🛡 '+((invUntil-now)/1000).toFixed(1)+'s';powerUpTimer.style.opacity='1';powerUpTimer.style.color='#0ff';}
    else if(now<magUntil){powerUpTimer.textContent='💫 '+((magUntil-now)/1000).toFixed(1)+'s';powerUpTimer.style.opacity='1';powerUpTimer.style.color='#0ff';}
    else powerUpTimer.style.opacity='0';

    if(now-lastPassed>2400){combo=0;comboDisplay.style.opacity='0';}
    render();
}

function updateUI(){
    scoreDisplay.textContent='SCORE '+score;
    if(score>highScore){highScore=score;highScoreDisplay.textContent='BEST '+highScore;}
}

function loop(ts){
    if(!lastTime)lastTime=ts;
    const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
    update(dt);rafId=requestAnimationFrame(loop);
}

function resize(){
    areaW=gameArea.clientWidth;areaH=gameArea.clientHeight;
    groundY=Math.floor(areaH*.72);
    if(player){player.y=Math.min(player.y,groundY);if(player.grounded)player.y=groundY;}
}

function bind(){
    window.addEventListener('keydown',e=>{
        if(e.repeat)return;
        if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
        if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
        if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW'){e.preventDefault();keys.jump=true;}
        if(e.code==='Escape'||e.code==='KeyP'){
            if(gameState==='playing')pauseGame();
            else if(gameState==='paused')resumeGame();
        }
    });
    window.addEventListener('keyup',e=>{
        if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
        if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
    });
    function touch(btn,on,off){
        btn.addEventListener('touchstart',e=>{e.preventDefault();on();btn.classList.add('active');},{passive:false});
        btn.addEventListener('touchend',e=>{e.preventDefault();off();btn.classList.remove('active');});
        btn.addEventListener('touchcancel',()=>{off();btn.classList.remove('active');});
        btn.addEventListener('mousedown',e=>{e.preventDefault();on();btn.classList.add('active');});
        btn.addEventListener('mouseup',()=>{off();btn.classList.remove('active');});
        btn.addEventListener('mouseleave',()=>{off();btn.classList.remove('active');});
    }
    touch(document.getElementById('leftBtn'),()=>keys.left=true,()=>keys.left=false);
    touch(document.getElementById('rightBtn'),()=>keys.right=true,()=>keys.right=false);
    touch(document.getElementById('jumpBtn'),()=>keys.jump=true,()=>{});
    document.getElementById('startBtn').addEventListener('click',startGame);
    document.getElementById('resumeBtn').addEventListener('click',()=>resumeGame());
    document.getElementById('restartBtn').addEventListener('click',startGame);
}

function startGame(){
    score=0;combo=0;difficulty=1;entities=[];particles=[];trail=[];
    invUntil=0;magUntil=0;spawnT=1.1;powerT=5.5;lastPassed=0;
    resize();player=createPlayer();player.y=groundY;
    startOverlay.style.display='none';pauseOverlay.style.display='none';gameOverOverlay.style.display='none';
    comboDisplay.style.opacity='0';powerUpTimer.style.opacity='0';
    updateUI();gameState='playing';lastTime=0;
    if(scoreInt)clearInterval(scoreInt);
    scoreInt=setInterval(()=>{if(gameState==='playing'&&!platformPaused){score+=1;updateUI();}},1000);
    if(!rafId)rafId=requestAnimationFrame(loop);
    playTone(440,'sine',.18,.28);
}

function pauseGame(fromPlat=false){
    if(gameState!=='playing')return;
    gameState='paused';
    if(!fromPlat)pauseOverlay.style.display='flex';
}
function resumeGame(fromPlat=false){
    if(gameState!=='paused')return;
    if(platformPaused&&!fromPlat)return;
    gameState='playing';pauseOverlay.style.display='none';lastTime=0;
}
function gameOver(){
    gameState='over';
    if(scoreInt)clearInterval(scoreInt);
    finalScoreEl.textContent=score;
    if(score>=highScore&&score>0){newBestText.style.display='block';saveHS();}
    else newBestText.style.display='none';
    if(yt&&yt.game&&yt.game.sendScore){try{yt.game.sendScore({value:score});}catch(e){}}
    gameOverOverlay.style.display='flex';
}

function init(){
    resize();
    window.addEventListener('resize',()=>{resize();});
    bind();loadHS();
    requestAnimationFrame(()=>{
        if(yt&&yt.game){try{yt.game.firstFrameReady();}catch(e){}}
        if(yt&&yt.game){try{yt.game.gameReady();}catch(e){}}
    });
    rafId=requestAnimationFrame(loop);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
</body>
</html>
